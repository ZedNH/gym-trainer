<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Gym Trainer player</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  p { color: #fff; font: 14px sans-serif; text-align: center; margin-top: 40vh; }
</style>
</head>
<body>
<script>
  // Gym Trainer app: plays one YouTube tutorial. ?v=<11-character YouTube id>
  (function () {
    var id = new URLSearchParams(location.search).get('v') || '';
    if (!/^[A-Za-z0-9_-]{11}$/.test(id)) {
      document.body.innerHTML = '<p>No video selected.</p>';
      return;
    }
    var f = document.createElement('iframe');
    f.src = 'https://www.youtube.com/embed/' + id + '?playsinline=1&rel=0&iv_load_policy=3';
    f.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen';
    f.referrerPolicy = 'strict-origin-when-cross-origin';
    f.allowFullscreen = true;
    f.title = 'YouTube video';
    document.body.appendChild(f);
  })();
</script>
</body>
</html>
